[project]
name = "regtrack"
version = "0.1.0"
description = "RegTrack India - automated Indian vehicle regulation tracker"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.1",
  "sqlalchemy>=2.0",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "pymupdf>=1.24",
  "httpx>=0.27",
  "tenacity>=8.2",
  "langchain-openai>=0.2",
  "playwright>=1.45",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "apscheduler>=3.10,<4",
  "jsonschema>=4.21",
  "minio>=7.2",
  "winrt-runtime; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
  "winrt-Windows.Foundation; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
  "winrt-Windows.Globalization; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["regtrack*"]

[tool.setuptools.package-data]
"regtrack.models" = ["schemas/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["discovery"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs PostgreSQL", "corpus: needs the seed corpus", "llm: needs LM Studio"]
