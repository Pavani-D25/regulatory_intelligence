services:
  db:
    image: pgvector/pgvector:pg16
    container_name: regtrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: regtrack
      POSTGRES_PASSWORD: regtrack
      POSTGRES_DB: regtrack
    ports:
      - "5432:5432"
    volumes:
      - regtrack_pg:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
      - ./db/seeds:/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regtrack -d regtrack"]
      interval: 5s
      timeout: 3s
      retries: 20

  # optional S3-compatible object store for the originals (STORAGE_BACKEND=s3); start with:
  #   docker compose --profile s3 up -d minio      console: http://localhost:9001
  minio:
    image: minio/minio:latest
    container_name: regtrack-minio
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-regtrack}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-regtrack-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - regtrack_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  regtrack_pg:
  regtrack_minio:
